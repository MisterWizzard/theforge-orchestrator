packages:
  - apps/*
  - packages/*

overrides:
  find-my-way: 9.7.0
  postcss: 8.5.23
  # sharp, 07/10/2026. CVE-2026-96889 (GHSA-wq5f-xc86-pv6w, high): bundled librsvg, fixed
  # in 0.35.5. Reaches production through apps/web > next > sharp; next accepts ^0.35.4.
  sharp: ^0.35.5
  nanoid: ^3.3.18
  # Two fast-uri majors are in the tree and each needs its own patched floor:
  # ajv/@fastify/ajv-compiler pin the 3.x line, something else pulls 4.x.
  # A blanket override would force one major onto consumers expecting the other.
  fast-uri@3: ^3.1.6
  fast-uri@4: ^4.1.3
  # Dev-only advisories from `pnpm audit` on 2026-09-26 (docs/evidence-dependency-audit-2026-09-26.txt):
  # patch-level bumps that the eslint and typescript-eslint trees had not picked up.
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  js-yaml@4: ^4.3.2
  # esbuild, 04/10/2026. GHSA: arbitrary file read while the dev server runs, fixed in
  # 0.28.1. Dependabot reports this one as scope=RUNTIME, not development, so it is the
  # only one of TheForge's four open alerts that could reach anything shipped.
  # Two copies were in the tree: 0.28.1 at the top and 0.27.7 nested under tsup, which
  # pins its own. `pnpm update esbuild` reached the first and not the second, so the
  # advisory stayed open - hence an override rather than a bump.
  # Note: this belongs here and NOT in package.json's `pnpm.overrides`. pnpm 11 ignores
  # that field and says so ("no longer read by pnpm"), which is easy to miss because
  # `pnpm install` still succeeds and the override simply does nothing.
  esbuild: ^0.28.1

allowBuilds:
  '@anthropic-ai/claude-code': true
  esbuild: true
  sharp: true
  simple-git-hooks: true
